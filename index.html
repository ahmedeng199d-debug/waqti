<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- اسم التطبيق المختصر عند إضافته للشاشة الرئيسية -->
    <title>وقتي - Waqti</title>
    <meta name="apple-mobile-web-app-title" content="وقتي - Waqti">
    <meta name="application-name" content="وقتي - Waqti">
    <meta name="theme-color" content="#020617">

    <!-- تخصيص أيقونة التطبيق (PWA & Apple) -->
    <link rel="apple-touch-icon" href="https://images.emojiterra.com/google/android-11/512px/1f48a.png">
    <link rel="icon" type="image/png" href="https://images.emojiterra.com/google/android-11/512px/1f48a.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- الشريط العلوي مع الشعار وزر تفعيل الصوت والإشعارات -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="relative w-11 h-11 rounded-2xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-xl shadow-inner border border-teal-500/30">
                    <i class="fa-solid fa-clock"></i>
                    <i class="fa-solid fa-stethoscope absolute -top-1 -right-1 text-xs bg-slate-900 px-1 rounded-full text-teal-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-teal-400 leading-tight">وقتي</h1>
                    <span class="text-[10px] text-slate-400 tracking-wider">WAQTI APP</span>
                </div>
            </div>

            <!-- زر تفعيل التنبيه الصوتي والإشعارات -->
            <button onclick="activateAppAlerts()" id="sound-btn" class="bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 border border-teal-500/30 px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-volume-xmark" id="sound-icon"></i>
                <span id="sound-text">تفعيل التنبيهات</span>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <div class="mb-6 bg-gradient-to-r from-teal-900/40 to-slate-900 p-4 rounded-2xl border border-teal-500/30 flex justify-between items-center">
            <div>
                <h2 class="font-bold text-base mb-0.5">جدول أدوية اليوم</h2>
                <span id="current-date" class="text-xs text-slate-400"></span>
            </div>
            <button onclick="testAlert()" class="bg-slate-800 hover:bg-slate-700 text-teal-300 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-bell"></i> اختبار المنبه
            </button>
        </div>

        <div id="medicines-list" class="space-y-3"></div>

        <div id="empty-state" class="hidden text-center py-12">
            <div class="text-slate-600 text-5xl mb-3">
                <i class="fa-solid fa-pills"></i>
            </div>
            <p class="text-slate-400 text-sm">لا توجد أدوية مضافة حالياً.</p>
            <p class="text-slate-600 text-xs mt-1">اضغط على زر الإضافة أدناه لبدء جدولة أدويتك.</p>
        </div>
    </main>

    <!-- زر إضافة دواء عائم -->
    <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto px-4 flex justify-end z-40">
        <button onclick="openModal()" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold p-4 rounded-full shadow-lg shadow-teal-500/30 transition-all flex items-center justify-center w-14 h-14">
            <i class="fa-solid fa-plus text-xl"></i>
        </button>
    </div>

    <!-- نافذة إضافة دواء -->
    <div id="medicine-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-teal-400">إضافة دواء جديد</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="medicine-form" onsubmit="addMedicine(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">اسم الدواء</label>
                    <input type="text" id="med-name" required placeholder="مثال: بانادول..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-teal-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">الجرعة / الكمية</label>
                    <input type="text" id="med-dose" required placeholder="مثال: حبة واحدة..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-teal-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">وقت التناول</label>
                    <input type="time" id="med-time" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-right">
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-semibold transition-colors">إلغاء</button>
                    <button type="submit" class="flex-1 bg-teal-500 hover:bg-teal-400 text-slate-950 py-2.5 rounded-xl text-sm font-bold transition-colors">حفظ الدواء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة التنبيه المباشر داخل التطبيق -->
    <div id="live-alert-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50"></div>

    <!-- جافاسكريبت -->
    <script>
        const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-IQ', options);

        let medicines = JSON.parse(localStorage.getItem('waqti_medicines')) || [];
        let alertAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        alertAudio.loop = true;
        let isAudioAllowed = false;

        // تفعيل الصوت وصلاحية إرسال الإشعارات للنظام
        function activateAppAlerts() {
            alertAudio.play().then(() => {
                alertAudio.pause();
                alertAudio.currentTime = 0;
                isAudioAllowed = true;
                
                // طلب الإذن لإظهار الإشعارات العلوية (Push Notifications)
                if (window.Notification && Notification.permission !== "granted") {
                    Notification.requestPermission();
                }
                
                const btn = document.getElementById('sound-btn');
                const icon = document.getElementById('sound-icon');
                const text = document.getElementById('sound-text');
                
                btn.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5";
                icon.className = "fa-solid fa-bell";
                text.innerText = "التنبيهات مفعلة";
            }).catch(err => {
                console.log("فشل تفعيل التنبيهات:", err);
            });
        }

        function testAlert() {
            const sampleMed = { id: 99999, name: "دواء تجريبي (بانادول)", dose: "حبة واحدة" };
            if (isAudioAllowed) { alertAudio.play().catch(e => console.log(e)); }
            triggerNotification(sampleMed);
            showLiveAlert(sampleMed, true);
        }

        function openModal() {
            document.getElementById('medicine-modal').classList.remove('hidden');
            document.getElementById('medicine-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('medicine-modal').classList.add('hidden');
            document.getElementById('medicine-modal').classList.remove('flex');
            document.getElementById('medicine-form').reset();
        }

        function addMedicine(e) {
            e.preventDefault();
            const name = document.getElementById('med-name').value;
            const dose = document.getElementById('med-dose').value;
            const time = document.getElementById('med-time').value;

            const newMed = {
                id: Date.now(),
                name,
                dose,
                time,
                taken: false,
                alertedToday: false
            };

            medicines.push(newMed);
            saveAndRender();
            closeModal();
        }

        function toggleTaken(id) {
            medicines = medicines.map(med => {
                if (med.id === id) { med.taken = !med.taken; }
                return med;
            });
            saveAndRender();
        }

        function deleteMedicine(id) {
            medicines = medicines.filter(med => med.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('waqti_medicines', JSON.stringify(medicines));
            renderMedicines();
        }

        function renderMedicines() {
            const listContainer = document.getElementById('medicines-list');
            const emptyState = document.getElementById('empty-state');
            listContainer.innerHTML = '';

            if (medicines.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            medicines.sort((a, b) => a.time.localeCompare(b.time));

            medicines.forEach(med => {
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border transition-all flex items-center justify-between ${med.taken ? 'bg-slate-900/50 border-emerald-500/30 opacity-75' : 'bg-slate-900 border-slate-800'}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl ${med.taken ? 'bg-emerald-500/20 text-emerald-400' : 'bg-teal-500/20 text-teal-400'} flex items-center justify-center font-bold text-lg">
                            <i class="fa-solid ${med.taken ? 'fa-check' : 'fa-pills'}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm ${med.taken ? 'line-through text-slate-400' : 'text-slate-100'}">${med.name}</h4>
                            <p class="text-xs text-slate-400 mt-0.5">الجرعة: ${med.dose}</p>
                            <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded bg-slate-800 text-teal-300 font-mono">
                                <i class="fa-regular fa-clock ml-1"></i>${med.time}
                            </span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleTaken(${med.id})" class="p-2.5 rounded-xl transition-all ${med.taken ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}" title="تم الأخذ">
                            <i class="fa-solid fa-check"></i>
                        </button>
                        <button onclick="deleteMedicine(${med.id})" class="p-2.5 rounded-xl bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition-colors" title="حذف">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // إرسال إشعار نظام حقيقي (Push Notification)
        function triggerNotification(med) {
            if (window.Notification && Notification.permission === "granted") {
                try {
                    new Notification("وقتي - حان وقت الدواء!", {
                        body: `الدواء: ${med.name}\nالجرعة: ${med.dose}`,
                        icon: "https://images.emojiterra.com/google/android-11/512px/1f48a.png"
                    });
                } catch (e) {
                    console.log("النظام لا يدعم إشعارات المتصفح:", e);
                }
            }
        }

        function checkMedicinesTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${hours}:${minutes}`;

            medicines.forEach(med => {
                if (med.time === currentTime && !med.taken && !med.alertedToday) {
                    med.alertedToday = true;
                    if (isAudioAllowed) {
                        alertAudio.play().catch(err => console.log(err));
                    }
                    triggerNotification(med);
                    showLiveAlert(med, false);
                }
            });
        }

        setInterval(checkMedicinesTime, 10000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                checkMedicinesTime();
            }
        });

        function showLiveAlert(med, isTest) {
            const alertBox = document.getElementById('live-alert-modal');
            alertBox.innerHTML = `
                <div class="bg-slate-900 border-2 border-rose-500 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl shadow-rose-500/20">
                    <div class="w-16 h-16 bg-rose-500/20 text-rose-500 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-1">${isTest ? 'اختبار المنبه' : 'حان وقت الدواء!'}</h3>
                    <p class="text-rose-400 font-semibold text-lg mb-2">${med.name}</p>
                    <p class="text-slate-400 text-sm mb-6">الجرعة المطلوبة: <span class="text-white font-bold">${med.dose}</span></p>
                    
                    <div class="flex gap-3">
                        ${isTest ? `
                            <button onclick="dismissAlert(0, 'close')" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl font-bold text-sm transition-colors">
                                إغلاق الاختبار
                            </button>
                        ` : `
                            <button onclick="dismissAlert(${med.id}, 'snooze')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-bold text-sm transition-colors">
                                تأجيل (10 دقائق)
                            </button>
                            <button onclick="dismissAlert(${med.id}, 'taken')" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-xl font-bold text-sm transition-colors shadow-lg shadow-emerald-500/30">
                                تم الأخذ ✓
                            </button>
                        `}
                    </div>
                </div>
            `;
            alertBox.classList.remove('hidden');
            alertBox.classList.add('flex');
        }

        function dismissAlert(id, action) {
            alertAudio.pause();
            alertAudio.currentTime = 0;

            const alertBox = document.getElementById('live-alert-modal');
            alertBox.classList.add('hidden');
            alertBox.classList.remove('flex');

            if (action === 'taken') {
                toggleTaken(id);
            } else if (action === 'snooze') {
                let med = medicines.find(m => m.id === id);
                if (med) {
                    let [h, m] = med.time.split(':').map(Number);
                    m += 10;
                    if (m >= 60) { h = (h + 1) % 24; m -= 60; }
                    med.time = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    med.alertedToday = false;
                    saveAndRender();
                }
            }
        }

        renderMedicines();
    </script>
</body>
</html>
